[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.1.5"
description = "Python utilities for querying and editing Beancount v3 ledgers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "beancount>=3.2.3",
    "beanquery>=0.1",
    "chat",
    "mcp",
    "pydantic>=2.0.0",
    "scripts",
    "tg_bot",
    "uvicorn>=0.30.0",
]

[project.scripts]
serve = "ledger.main:main"
mcp_stdio = "ledger.mcp_server:mcp_stdio"
mcp_server = "ledger.mcp_server:mcp_server"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
chat = { git = "ssh://git@ssh.git.valerii.casa/valerii/chat.git" }
scripts = { workspace = true }
tg_bot = { workspace = true }
mcp = { git = "ssh://git@ssh.git.valerii.casa/valerii/chat.git", subdirectory = "src/mcp" }

[tool.uv.workspace]
members = ["src/tg_bot", "src/scripts"]
