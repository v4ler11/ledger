name: Set up Docker Buildx for internal registry
description: >-
  Configures buildx so buildkitd runs on the forgejo_forgejo network and can
  reach the Forgejo registry at git.valerii.casa (HTTPS).
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=forgejo_forgejo
