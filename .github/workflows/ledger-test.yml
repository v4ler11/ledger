name: ledger-test

on:
  push:
    paths:
      - 'ledger/**.py'
      - 'ledger/**.yaml'
      - 'ledger/**.yml'
      - '.github/**'
  pull_request:
    paths:
      - 'ledger/**.py'
      - 'ledger/**.yaml'
      - 'ledger/**.yml'
      - '.github/**'

defaults:
  run:
    working-directory: ledger

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # ledger.globals reads these at import; tests monkeypatch values per-test,
      # so only presence (and an int for TARGET_USER_ID) is required.
      LEDGER_TG_TARGET_USER_ID: ${{ secrets.LEDGER_TG_TARGET_USER_ID }}
      LEDGER_TG_BOT_TOKEN: ${{ secrets.LEDGER_TG_BOT_TOKEN }}
      LEDGER_OPENROUTER_API_KEY: ${{ secrets.LEDGER_OPENROUTER_API_KEY }}
      LEDGER_PATH: ${{ github.workspace }}/ledger-test.bean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up SSH for private dependencies
        uses: ./.github/actions/setup-ssh-private
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q