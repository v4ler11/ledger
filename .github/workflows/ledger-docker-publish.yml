name: ledger-docker-publish

on:
  push:
    tags:
      - 'ledger-v*'

env:
  REGISTRY: git.valerii.casa
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ledger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH for private dependencies
        uses: ./.github/actions/setup-ssh-private
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify version match
        id: version
        run: |
          FILE_VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' pyproject.toml | head -1)
          [ -n "$FILE_VERSION" ] || { echo "::error::could not extract version from pyproject.toml"; exit 1; }
          TAG_VERSION=${GITHUB_REF#refs/tags/ledger-v}
          echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag $GITHUB_REF is not ledger-vX.Y.Z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG_VERSION" ] \
            || { echo "::error::version mismatch: pyproject.toml ($FILE_VERSION) vs tag ($TAG_VERSION)"; exit 1; }
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${TAG_VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-internal-buildx

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ledger
          file: ledger/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          ssh: default
          add-hosts: |
            git.valerii.casa=host-gateway
            ssh.git.valerii.casa=host-gateway
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.tag_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
