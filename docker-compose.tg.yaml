services:
  tg-bot:
    build:
      context: .
      dockerfile: Dockerfile.tg
      ssh:
        - default
    command: ["uv", "run", "tg_server"]
    environment:
      LEDGER_TG_BOT_TOKEN: ${LEDGER_TG_BOT_TOKEN:?set LEDGER_TG_BOT_TOKEN in .env or the shell}
      LEDGER_TG_TARGET_USER_ID: ${LEDGER_TG_TARGET_USER_ID:?set LEDGER_TG_TARGET_USER_ID in .env or the shell}
      LEDGER_OPENROUTER_API_KEY: ${LEDGER_OPENROUTER_API_KEY:-}
      LEDGER_PATH: ${LEDGER_PATH:-/data/ledger.bean}
    volumes:
      - ${LEDGER_DATA_DIR:-./data}:/data
    restart: unless-stopped
