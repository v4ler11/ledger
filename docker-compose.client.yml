# Client: read-only ledger mirror (ledgerd reader) + the ledger MCP server
# over stdio, from prebuilt registry images
#
# reader:  fetches the finances repo and hard-resets to origin/$BRANCH every
#          PULL_INTERVAL (read-only, never pushes). Needs an SSH key that
#          may read; mounted read-only at /root/.ssh/id_rsa.
# ledger:  the stdio MCP server — NO baked command (the image has no CMD).
#          The user passes the exec command at spawn time; the chat client
#          launches it fresh per session, JSON-RPC over stdin → stdout:
#            docker compose -f docker-compose.client.yml run --rm -T ledger uv run mcp_stdio
#          Host-side equivalent (from ledger/): uv run mcp_stdio
#          (HTTP/SSE entry point instead: uv run mcp_server)
#          Both containers share ./data/reader-repo — the reader's /repo is
#          the MCP server's /data.
#
# Up reader only:  docker compose -f docker-compose.client.yml up -d reader
# MCP command:     LEDGER_PATH=/Users/valerii/code/ledger/data/reader-repo/main.bean uv run --directory /Users/valerii/code/ledger/ledger mcp_stdio

services:
  reader:
    image: git.valerii.casa/valerii/ledgerd-reader:latest
    environment:
      REPO_URL: ssh://git@ssh.git.valerii.casa/valerii/finances.git
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${HOME}/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - ${LEDGER_DATA_DIR:-./data}/reader-repo:/repo
    restart: unless-stopped
